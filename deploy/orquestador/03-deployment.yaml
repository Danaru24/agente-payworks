apiVersion: apps/v1
kind: Deployment
metadata:
  name: orquestador-payworks
  labels: {app: orquestador-payworks}
spec:
  replicas: 1
  selector:
    matchLabels: {app: orquestador-payworks}
  template:
    metadata:
      labels: {app: orquestador-payworks}
    spec:
      containers:
        - name: orquestador
          image: quay.io/TODO/orquestador-payworks:0.1.0   # TODO(ulises)
          ports: [{containerPort: 8080}]
          envFrom:
            - configMapRef: {name: orquestador-payworks-config}
            - secretRef: {name: orquestador-payworks-secret}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 15
 