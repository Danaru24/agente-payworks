# Build inmutable dentro del namespace (binario, estrategia Docker con el Containerfile).
# Uso: ver deploy/orquestador/RELEASE.md
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: orquestador-payworks
  labels: {app: orquestador-payworks}
spec:
  lookupPolicy:
    local: true          # permite que el Deployment use "orquestador-payworks:<tag>" sin hostname de registry
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: orquestador-payworks
  labels: {app: orquestador-payworks}
spec:
  runPolicy: Serial
  source:
    type: Binary         # el código llega con: oc start-build --from-repo=.
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: orquestador-payworks:build   # tag de staging; el release se fija con "oc tag"
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "1", memory: 2Gi}
  successfulBuildsHistoryLimit: 5
  failedBuildsHistoryLimit: 3

